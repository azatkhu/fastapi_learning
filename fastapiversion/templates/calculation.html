<h1> ВЫЧИСЛЕНИЯ </h1>

<form action = "http://localhost:8000/calculation" method = "get">

    <input type = "number" name = "a" value = {{a}}> 
    <select name = "operation">

        <option value = "+" {{"selected" if operation == "+" else "" }}> + </option>
        <option value = "-" {{"selected" if operation == "-" else "" }}> - </option>
        <option value = "*" {{"selected" if operation == "*" else "" }}> * </option>
        <option value = "/" {{"selected" if operation == "/" else "" }}> / </option>
        <option value = "//" {{"selected" if operation == "//" else "" }}> // </option>
        <option value = "**" {{"selected" if operation == "**" else "" }}> ** </option>
    
    </select>
    <input type = "number" name = "b" value = {{b}}>
    <input type = "submit" value = "Find answer">
    
</form>

{% if result %}
    <p>{{result}}</p>
{% endif %}
